<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Nook — lists, notes and voice memos on one board</title>
    <meta
      name="description"
      content="Shopping lists, sticky notes and voice memos on one board you share with the people you live with."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nook" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Nook" />
    <meta property="og:description" content="Lists, notes and voice memos on one shared board." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://nook-navy-mu.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* The splash is plain HTML so it is on screen before any script arrives. */
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #fff; transition: opacity .35s ease, visibility .35s;
        font-family: 'Bricolage Grotesque Variable', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash .row { display: flex; align-items: flex-end; gap: 10px; height: 64px; }
      #splash svg { width: 52px; height: 52px; opacity: 0; animation: nook-drop .7s cubic-bezier(.3,1.6,.5,1) forwards; }
      #splash svg:nth-child(2) { width: 44px; height: 44px; animation-delay: .08s; }
      #splash svg:nth-child(3) { animation-delay: .16s; }
      #splash svg:nth-child(4) { animation-delay: .24s; }
      #splash .word { margin-top: 18px; text-align: center; font-size: 34px; letter-spacing: -.04em; color: #111;
        opacity: 0; animation: nook-rise .5s .38s ease-out forwards; }
      @keyframes nook-drop {
        0% { opacity: 0; transform: translateY(-46px) rotate(-25deg) scale(.6); }
        60% { opacity: 1; }
        100% { opacity: 1; transform: none; }
      }
      @keyframes nook-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #splash svg, #splash .word { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div>
        <div class="row">
          <svg viewBox="0 0 40 40"><path d="M20 4l17 30H3L20 4z" fill="#E2F16B" /></svg>
          <svg viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" fill="#F0582F" /></svg>
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#4450D6" /></svg>
          <svg viewBox="0 0 40 40"><g fill="#DBB8F2"><circle cx="20" cy="11" r="9" /><circle cx="29" cy="20" r="9" /><circle cx="20" cy="29" r="9" /><circle cx="11" cy="20" r="9" /><circle cx="20" cy="20" r="8" /></g></svg>
        </div>
        <div class="word">Nook</div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>Nook needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
